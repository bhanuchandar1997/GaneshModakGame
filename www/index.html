<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ganesh Chaturthi - Modak Collector V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#170b29;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:100vw;height:100dvh;max-width:700px;overflow:hidden;background:#2d104d}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;pointer-events:none}
.box{min-width:0;background:linear-gradient(#37174fdd,#1d0d2edd);border:2px solid #ffc64f;border-radius:16px;padding:7px 10px;color:#fff;box-shadow:0 5px 16px #0008;text-shadow:0 2px 2px #000}
.box b{font-size:clamp(20px,5vw,30px);color:#fff}
.label{font-size:12px;color:#ffd66b;font-weight:700;display:block}
.logo{position:absolute;z-index:4;top:105px;left:50%;transform:translateX(-50%);text-align:center;color:#ffd65a;font-weight:900;text-shadow:0 3px 0 #7b2800,0 5px 12px #000;font-size:clamp(25px,7vw,42px);line-height:.9;pointer-events:none}
.logo small{display:block;font-size:12px;letter-spacing:2px;color:#fff;margin-top:8px;text-shadow:0 2px #4a123f}
.instruction{position:absolute;z-index:4;top:184px;left:50%;transform:translateX(-50%);width:85%;text-align:center;color:#ffeab0;font-weight:700;font-size:clamp(13px,3.5vw,18px);pointer-events:none}
.controls{position:absolute;z-index:8;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 22px}
.ctrl{width:82px;height:82px;border-radius:50%;border:3px solid #ffd15c;background:linear-gradient(#ff8b25,#df3b17);color:white;font-size:42px;font-weight:900;box-shadow:0 7px 0 #8d250f,0 10px 20px #0008}
.ctrl:active{transform:translateY(5px);box-shadow:0 2px 0 #8d250f}
.overlay{position:absolute;inset:0;z-index:20;background:#130720dd;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{width:min(500px,94%);padding:28px 20px;border:3px solid #ffc957;border-radius:26px;background:linear-gradient(#42185feF,#1d0b30f5);box-shadow:0 20px 60px #000b}
h1{margin:0;color:#ffd25b;font-size:clamp(34px,9vw,60px);text-shadow:0 4px #812b00}
h2{margin:10px 0;color:#fff}
p{color:#ffe8b1;line-height:1.5}
button.start{border:0;border-radius:16px;padding:15px 28px;font-size:19px;font-weight:900;color:#4a1700;background:#ffd25b;box-shadow:0 5px #b66b12}
.hidden{display:none}
.tip{font-size:13px;opacity:.85}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div class="hud">
  <div class="box">⭐ <span class="label">SCORE</span><b id="score">0</b></div>
  <div class="box">🍬 <span class="label">MODAKS</span><b id="mods">0/21</b></div>
  <div class="box">❤️ <span class="label">LIVES</span><b id="lives">3</b></div>
  <div class="box">⏱️ <span class="label">TIME</span><b id="time">60s</b></div>
</div>
<div class="logo">GANESH<br>CHATURTHI<small>MODAK COLLECTOR</small></div>
<div class="instruction">COLLECT MODAKS • SPREAD HAPPINESS</div>

<div class="controls">
  <button class="ctrl" id="L">◀</button>
  <button class="ctrl" id="R">▶</button>
</div>

<div class="overlay" id="overlay">
 <div class="card" id="card">
  <h1>🐘</h1><h2>GANESH CHATURTHI<br>MODAK COLLECTOR</h2>
  <p>Collect <b>21 modaks</b>, avoid the bombs, and help make the festival clean & green! 🌱</p>
  <button class="start" id="start">START FESTIVAL 🙏</button>
  <p class="tip">Swipe or use the left/right buttons. Keyboard arrows also work.</p>
 </div>
</div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=0,H=0,dpr=1,running=false,last=0,spawn=0,score=0,mods=0,lives=3,t=60,items=[],sparks=[],left=false,right=false;
const p={x:.5,y:0,w:58,h:78,v:430};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);p.y=H*.78}
addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
function hud(){$('score').textContent=score;$('mods').textContent=mods+'/21';$('lives').textContent=lives;$('time').textContent=Math.ceil(t)+'s'}
function start(){score=0;mods=0;lives=3;t=60;items=[];sparks=[];p.x=.5;running=true;$('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
$('start').onclick=start;
function bind(el,fn){el.onpointerdown=e=>{e.preventDefault();fn(true)};el.onpointerup=e=>{e.preventDefault();fn(false)};el.onpointercancel=el.onpointerleave=e=>fn(false)}
bind($('L'),v=>left=v);bind($('R'),v=>right=v);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});
let sx=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>35){p.x=Math.max(.08,Math.min(.92,p.x+Math.sign(dx)*.12))}},{passive:true});
function rr(a,b){return Math.random()*(b-a)+a}
function spawnItem(){items.push({x:rr(.08,.92),y:-.05,vy:rr(.16,.28),type:Math.random()<.16?'bomb':'modak',r:20,a:0})}
function hit(it){let px=p.x*W,py=p.y;return Math.abs(it.x*W-px)<38 && Math.abs(it.y*H-py)<55}
function burst(X,Y,txt){sparks.push({x:X,y:Y,life:1,txt});for(let i=0;i<10;i++)sparks.push({x:X,y:Y,life:.8,txt:'✦',vx:rr(-80,80),vy:rr(-120,-30)})}
function bg(){
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#21104c');g.addColorStop(.48,'#63205d');g.addColorStop(1,'#ef7e38');x.fillStyle=g;x.fillRect(0,0,W,H);
 // moon and stars
 x.fillStyle='#ffe9ad';x.beginPath();x.arc(W*.83,H*.13,Math.min(W,H)*.065,0,7);x.fill();
 for(let i=0;i<40;i++){x.fillStyle='#ffd75e';x.globalAlpha=.35+.5*Math.sin(i*2);x.beginPath();x.arc((i*83)%W,H*.24+((i*47)%120),2.5,0,7);x.fill()}x.globalAlpha=1;
 // lights
 x.strokeStyle='#f6c84e';x.lineWidth=3;x.beginPath();x.moveTo(0,H*.30);x.quadraticCurveTo(W*.5,H*.36,W,H*.30);x.stroke();
 for(let i=0;i<18;i++){let xx=i*W/17,yy=H*.30+Math.sin(xx/W*Math.PI*2)*18;circle(xx,yy+5,5,'#ffd65a')}
 // banners
 banner(W*.07,H*.34,'ॐ');banner(W*.93,H*.34,'🙏');
 // temple
 x.fillStyle='#4b1947';x.fillRect(0,H*.48,W,H*.31);x.fillStyle='#722452';
 x.beginPath();x.moveTo(W*.25,H*.48);x.lineTo(W*.5,H*.36);x.lineTo(W*.75,H*.48);x.fill();
 x.fillStyle='#f4a03c';x.fillRect(W*.44,H*.47,W*.12,H*.28);
 // glowing Ganesha symbol
 x.fillStyle='#ffb64a';x.font='bold '+Math.floor(Math.min(W,H)*.14)+'px serif';x.textAlign='center';x.fillText('ॐ',W*.5,H*.59);
 // floor
 x.fillStyle='#c95d36';x.fillRect(0,H*.79,W,H*.21);
 for(let i=0;i<14;i++){x.strokeStyle='#f8c35b';x.lineWidth=2;x.beginPath();x.moveTo(i*W/13,H*.79);x.lineTo(i*W/13+35,H);x.stroke()}
}
function banner(X,Y,s){x.fillStyle='#6b1851';x.fillRect(X-35,Y-75,70,130);x.fillStyle='#ffc44d';x.font='bold 27px serif';x.textAlign='center';x.fillText(s,X,Y-15)}
function circle(X,Y,R,F){x.fillStyle=F;x.beginPath();x.arc(X,Y,R,0,7);x.fill()}
function ganesha(){
 let X=p.x*W,Y=p.y;
 // shadow
 x.fillStyle='#0005';x.beginPath();x.ellipse(X,Y+37,35,8,0,0,7);x.fill();
 circle(X,Y,30,'#f49a42');x.fillStyle='#f28b3d';
 x.beginPath();x.ellipse(X-34,Y-3,21,28,-.15,0,7);x.fill();x.beginPath();x.ellipse(X+34,Y-3,21,28,.15,0,7);x.fill();
 // crown
 x.fillStyle='#ffd04e';x.beginPath();x.moveTo(X-23,Y-27);x.lineTo(X,Y-54);x.lineTo(X+23,Y-27);x.closePath();x.fill();
 circle(X,Y-2,25,'#ffad55');circle(X-9,Y-6,3.5,'#331127');circle(X+9,Y-6,3.5,'#331127');
 x.strokeStyle='#e07c38';x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(X,Y+3);x.quadraticCurveTo(X+7,Y+27,X-5,Y+32);x.stroke();
 x.strokeStyle='#fff1d0';x.lineWidth=5;x.beginPath();x.moveTo(X-7,Y+15);x.lineTo(X-19,Y+22);x.moveTo(X+7,Y+15);x.lineTo(X+19,Y+22);x.stroke();
 x.fillStyle='#d72d35';x.fillRect(X-2,Y-23,4,10);
}
function modak(it){let X=it.x*W,Y=it.y*H;x.save();x.translate(X,Y);x.rotate(Math.sin(it.a)*.1);x.fillStyle='#ffe06b';x.beginPath();x.moveTo(-19,5);x.quadraticCurveTo(-17,-15,0,-23);x.quadraticCurveTo(17,-15,19,5);x.quadraticCurveTo(0,21,-19,5);x.fill();x.strokeStyle='#d58b25';x.lineWidth=2;for(let i=-10;i<=10;i+=7){x.beginPath();x.moveTo(i,-8);x.lineTo(i/2,10);x.stroke()}x.restore()}
function bomb(it){let X=it.x*W,Y=it.y*H;circle(X,Y,22,'#17151e');circle(X-6,Y-4,4,'#ff4b3b');x.strokeStyle='#ffd34f';x.lineWidth=3;x.beginPath();x.moveTo(X+12,Y-16);x.quadraticCurveTo(X+25,Y-28,X+20,Y-39);x.stroke()}
function end(win){running=false;$('overlay').classList.remove('hidden');$('card').innerHTML=win?`<h1>🎉</h1><h2>FESTIVAL COMPLETE!</h2><p><b>Ganpati Bappa Morya! 🙏</b></p><p>All 21 modaks collected.<br>Final Score: <b>${score}</b></p><button class="start" onclick="start()">PLAY AGAIN</button>`:`<h1>🙏</h1><h2>FESTIVAL OVER</h2><p>You collected <b>${mods}/21</b> modaks.</p><p>Final Score: <b>${score}</b></p><button class="start" onclick="start()">TRY AGAIN</button>`}
function loop(now){if(!running)return;let dt=Math.min(.033,(now-last)/1000);last=now;t-=dt;if(t<=0){t=0;hud();end(false);return}
 if(left)p.x-=p.v*dt/W;if(right)p.x+=p.v*dt/W;p.x=Math.max(.07,Math.min(.93,p.x));
 spawn-=dt;if(spawn<=0){spawn=.48;spawnItem()}
 for(let i=items.length-1;i>=0;i--){let it=items[i];it.y+=it.vy*dt;it.a+=dt*5;if(hit(it)){if(it.type==='modak'){mods++;score+=10;burst(it.x*W,it.y*H,'+10');if(mods>=21){hud();end(true);return}}else{lives--;score=Math.max(0,score-20);burst(it.x*W,it.y*H,'-20');if(lives<=0){hud();end(false);return}}items.splice(i,1)}else if(it.y>1.05)items.splice(i,1)}
 sparks=sparks.filter(s=>(s.life-=dt)>0);hud();draw();requestAnimationFrame(loop)}
function draw(){bg();items.forEach(i=>i.type==='modak'?modak(i):bomb(i));ganesha();x.textAlign='center';for(let s of sparks){x.globalAlpha=Math.max(0,s.life);x.fillStyle='#ffe16b';x.font='bold 22px Arial';x.fillText(s.txt,s.x,s.y);s.y+=(s.vy||-25)*.016;s.x+=(s.vx||0)*.016}x.globalAlpha=1}
draw();
</script>
</body>
</html>
